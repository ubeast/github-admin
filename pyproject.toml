[project]
name = "repo-healthcheck"
version = "0.1.0"
description = "CLI that consolidates every GitHub (and optionally GitLab) repo you can see into one worst-first health-check report -- README, license, branch protection, CI, tests, staleness, and more -- as a terminal table or an interactive HTML dashboard."
readme = "README.md"
authors = [
    { name = "Michael Schertz", email = "michael.schertz@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
repo-healthcheck = "repo_healthcheck.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Inline CSS/JS/HTML content -- long one-liners here are more readable
# unwrapped than artificially broken across lines.
"src/repo_healthcheck/render_dashboard.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
