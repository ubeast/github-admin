[project]
name = "github-admin"
version = "0.1.0"
description = "Consolidates all your GitHub repos into a single health-check view: README, license, contributors, forks, staleness, and more, at a glance."
readme = "README.md"
authors = [
    { name = "Michael Schertz", email = "michael.schertz@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
github-admin = "github_admin.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
