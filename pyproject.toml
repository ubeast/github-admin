[project]
name = "repo-healthcheck"
version = "0.1.0"
description = "CLI that consolidates every GitHub (and optionally GitLab) repo you can see into one worst-first health-check report -- README, license, branch protection, CI, tests, staleness, and more -- as a terminal table or an interactive HTML dashboard."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Michael Schertz", email = "michael.schertz@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
]
keywords = ["github", "gitlab", "cli", "repo", "health-check", "devtools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://ubeast.github.io/repo-healthcheck/"
Repository = "https://github.com/ubeast/repo-healthcheck"
Issues = "https://github.com/ubeast/repo-healthcheck/issues"
Author = "https://medium.com/@michael.schertz"

[project.scripts]
repo-healthcheck = "repo_healthcheck.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Hatchling's default sdist includes every git-tracked file, which pulls in
# docs/ (screenshots, landing page HTML), .github/, and uv.lock -- none of
# which are needed to build or install the package. Restrict it to what
# actually is.
include = [
    "src/repo_healthcheck",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 130
target-version = "py310"
# attic/ is retired reference material, deliberately outside the package,
# docs site, and CI (see attic/README.md). gen_social.py there is a one-off
# image-generation script that doesn't follow -- and shouldn't be held to --
# this project's lint rules. force-exclude so pre-commit / explicit paths
# skip it too, not just `ruff check .`.
extend-exclude = ["attic"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Inline CSS/JS/HTML content -- long one-liners here are more readable
# unwrapped than artificially broken across lines.
"src/repo_healthcheck/render_dashboard.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
